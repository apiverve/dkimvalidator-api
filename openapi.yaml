openapi: 3.0.4
info:
  title: DKIM Validator
  description: >-
    DKIM Validator checks the DomainKeys Identified Mail (DKIM) DNS records for
    a domain to verify that they are present and correctly formatted.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/dkimvalidator:
    get:
      summary: DKIM Validator
      description: >-
        DKIM Validator checks the DomainKeys Identified Mail (DKIM) DNS records
        for a domain to verify that they are present and correctly formatted.
      operationId: dkimvalidator
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: The domain to validate the DKIM record for
          example: github.com
        - name: selector
          in: query
          schema:
            type: string
          required: false
          description: >-
            The DKIM selector to look up (the label before ._domainkey). When
            omitted, a list of common selectors is tried
          example: s1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  selector: s1
                  host: github.com
                  dkim_host: s1._domainkey.github.com
                  cname_target: null
                  has_dkim_record: true
                  dkim_record: >-
                    k=rsa; t=s;
                    
                  dkim_records_count: 1
                  key_type: rsa
                  issues_found:
                    - code: V_TAG_NOT_FOUND
                      type: warning
                      message: The v tag is missing
                    - code: STRICT_MODE
                      type: info
                      message: >-
                        Strict flag set (t=s): the i= identity domain must
                        exactly match d= (no subdomains)
                  valid: true
                  key_bits: 2048
                  is_test_mode: false
                  risk_score: 0
                  risk_level: low
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
